  <link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238E2443'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' text-anchor='middle' fill='%23fff'%3E15%3C/text%3E%3C/svg%3E">
  <script>
    /* Set the theme before paint to avoid a flash. The web app manifest is linked only over http(s),
       because browsers block manifests opened from file://. */
    (function () {
      if (/^https?:$/.test(location.protocol)) {
        var l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest";
        document.head.appendChild(l);
      }
      try {
        var s = JSON.parse(localStorage.getItem("spanish15.progress.v1") || "{}");
        var t = (s.settings && s.settings.theme) || "auto";
        var dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
